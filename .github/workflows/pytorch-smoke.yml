name: PyTorch inference contracts
on:
  pull_request:
    paths: ['pytorch/**', '.github/workflows/pytorch-smoke.yml']
  push:
    paths: ['pytorch/**', '.github/workflows/pytorch-smoke.yml']
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e ./pytorch
      - run: python -m unittest discover -s pytorch/tests -v
